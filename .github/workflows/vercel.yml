name: Deploy na Vercel

# Publica o app e a API na Vercel a cada envio à main.
# Precisa do segredo VERCEL_TOKEN (Settings > Secrets and variables > Actions).
# Sem o segredo, o job termina sem fazer nada.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir token
        id: token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Segredo VERCEL_TOKEN não configurado; deploy ignorado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Vincular projeto
        if: steps.token.outputs.ok == 'true'
        run: npx --yes vercel@latest link --yes --project ecossistema-sala-de-aula --token "$VERCEL_TOKEN"

      - name: Publicar em produção
        if: steps.token.outputs.ok == 'true'
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Publicado: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Conferir o site
        if: steps.token.outputs.ok == 'true'
        run: |
          base="${{ steps.deploy.outputs.url }}"
          echo "App: $(curl -s -o /dev/null -w '%{http_code}' "$base/")"
          echo "API sem token (esperado 401): $(curl -s -o /dev/null -w '%{http_code}' "$base/api/me")"
          curl -s -X POST "$base/api/sessoes" -H 'Content-Type: application/json' \
            -d '{"login":"prof.gabriel","senha":"demo123"}' | head -c 200; echo
